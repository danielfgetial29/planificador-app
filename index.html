<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planificador de Tareas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <!--Inyeccion del navbar-->
    <div id="navbar"></div>

    <main class="flex-grow-1 container-fluid px-4 py-4">
      <div class="mb-4">
        <h1 class="h3 fw-bold mb-0">Mi Tablero</h1>
        <small class="text-secondary" id="contador-tareas"></small>
      </div>
      <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4 mb-4">
        <div
          class="tablero d-flex flex-column flex-md-row justify-content-between align-items-stretch gap-4 pb-2 w-100"
        >
          <!--Columna En proceso-->
          <section
            class="columna card bg-body-secondary border-0 rounded-4 flex-grow-1"
          >
            <div
              class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center"
            >
              <h2 class="h6 fw-semibold mb-0">
                <span class="badge rounded-circle bg-warning p-1 me-2"></span
                >Pendiente
              </h2>
              <span
                class="badge rounded-pill text-bg-light border"
                data-contador="pendiente"
                >0</span
              >
            </div>
            <div
              class="card-body d-flex flex-column gap-2 py-0"
              data-lista="pendiente"
            ></div>
            <div class="card-footer bg-transparent border-0">
              <button
                class="btn btn-sm btn-link text-decoration-none text-secondary p-0"
                data-bs-toggle="modal"
                data-bs-target="#modalTarea"
                data-estado="pendiente"
              >
                + Añadir tarea
              </button>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
