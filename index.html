<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planificador de Tareas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <!-- Aquí se inyecta el navbar -->
    <div id="navbar"></div>

    <main class="flex-grow-1 container-fluid px-4 py-4">
      <div class="mb-4">
        <h1 class="h3 fw-bold mb-0">Mi tablero</h1>
      </div>
      <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4 mb-4">
        <div class="tablero d-flex align-items-start gap-3 pb-2">
          <!-- Columna -->
          <section
            class="columna card bg-body-secondary border-0 rounded-4 flex-shrink-0"
          >
            <div
              class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center"
            >
              <h2 class="h6 fw-semibold mb-0">
                <span class="badge rounded-circle bg-warning p-1 me-2"> </span
                >Pendiente
              </h2>
              <span class="badge rounded-pill text-bg-light border">0</span>
            </div>

            <div class="card-body d-flex flex-column gap-2 py-0">
              <p class="text-center text-secondary my-4">Sin tareas</p>
            </div>

            <div class="card-footer bg-transparent border-0">
              <button
                class="btn btn-sm btn-link text-decoration-none text-secondary p-0"
              >
                + Añadir tarea
              </button>
            </div>
          </section>

          <!-- Columna con tareas -->
          <section
            class="columna card bg-body-secondary border-0 rounded-4 flex-shrink-0"
          >
            <div
              class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center"
            >
              <h2 class="h6 fw-semibold mb-0">
                <span class="badge rounded-circle bg-primary p-1 me-2"> </span
                >En progreso
              </h2>
              <span class="badge rounded-pill text-bg-light border">0</span>
            </div>

            <div class="card-body d-flex flex-column gap-2 py-0">
              <p class="text-center text-secondary my-4">Sin tareas</p>
            </div>

            <div class="card-footer bg-transparent border-0">
              <button
                class="btn btn-sm btn-link text-decoration-none text-secondary p-0"
              >
                + Añadir tarea
              </button>
            </div>
          </section>

          <!-- Columna -->
          <section
            class="columna card bg-body-secondary border-0 rounded-4 flex-shrink-0"
          >
            <div
              class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center"
            >
              <h2 class="h6 fw-semibold mb-0">
                <span class="badge rounded-circle bg-success p-1 me-2"> </span
                >Completada
              </h2>
              <span class="badge rounded-pill text-bg-light border">0</span>
            </div>

            <div class="card-body d-flex flex-column gap-2 py-0">
              <p class="text-center text-secondary my-4">Sin tareas</p>
            </div>

            <div class="card-footer bg-transparent border-0">
              <button
                class="btn btn-sm btn-link text-decoration-none text-secondary p-0"
              >
                + Añadir tarea
              </button>
            </div>
          </section>

          <!-- Botón "Añadir columna" -->
          <button class="btn btn-outline-secondary flex-shrink-0">
            + Añadir columna
          </button>
        </div>
      </div>
      <!-- Contenedor del tablero (tipo Trello) -->
    </main>

    <!-- Aquí se inyecta el footer -->
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/includes.js"></script>
  </body>
</html>
